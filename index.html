<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapeamento Inicial | Jacqueline Eidt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Jost', sans-serif; background: #FAF7F2; color: #2C2C2A; }
  .serif { font-family: 'Playfair Display', serif; }
  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  button { cursor: pointer; font-family: inherit; border: none; }
  button:focus-visible { outline: 2px solid #085041; outline-offset: 2px; }
  .opt-btn { transition: all 0.15s ease; }
  .opt-btn:hover { transform: translateY(-1px); }
  a { text-decoration: none; }
  input { font-family: inherit; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const WEB3FORMS_KEY = "c196d5f1-fe9c-419a-b164-b772b4a216b6";

const COLORS = {
  teal: "#085041", tealMid: "#1D9E75", tealLight: "#E1F5EE", tealAcc: "#9FE1CB",
  amber: "#EF9F27", amberLight: "#FAEEDA", rose: "#C4748A", roseLight: "#F5E7EB",
  grayD: "#2C2C2A", grayM: "#5F5E5A", grayL: "#F7F5F0", grayB: "#D3D1C7",
  white: "#FFFFFF", cream: "#FAF7F2",
};

const SCALE = [
  { v: 0, label: "Nunca" },
  { v: 1, label: "Raramente" },
  { v: 2, label: "Às vezes" },
  { v: 3, label: "Frequentemente" },
  { v: 4, label: "Quase sempre" },
];

const AREAS = ["Trabalho", "Estudos", "Rotina em casa", "Relacionamentos", "Várias áreas"];
const FAIXAS = ["Até 24 anos", "25 a 34 anos", "35 a 44 anos", "45 a 59 anos", "60 anos ou mais"];

const BLOCKS = [
  { key: "execucao", label: "Execução", number: "01", title: "Execução e Iniciação", subtitle: "Dificuldade de começar e terminar",
    items: [
      "Tenho dificuldade para iniciar tarefas importantes, mesmo sabendo que precisam ser feitas.",
      "Adio atividades mesmo sabendo que são importantes.",
      "Só consigo produzir quando o prazo está quase acabando.",
      "Começo tarefas com energia e abandono antes de terminar.",
      "Acumulo várias tarefas antes de conseguir começar a resolvê-las.",
      "Sinto que meu cérebro 'trava' antes de começar algo.",
    ]},
  { key: "atencao", label: "Atenção", number: "02", title: "Atenção e Memória", subtitle: "Como seu cérebro processa informação",
    items: [
      "Esqueço o que estava fazendo no meio de uma tarefa.",
      "Tenho dificuldade de manter o foco em algo que não me interessa.",
      "Leio um texto e preciso reler porque não absorvi nada.",
      "Me distraio facilmente com estímulos externos ou pensamentos.",
      "Esqueço compromissos, prazos ou informações importantes.",
      "Perco muito tempo em redes sociais ou outras distrações sem perceber.",
    ]},
  { key: "emocional", label: "Emocional", number: "03", title: "Regulação Emocional", subtitle: "Como você lida com frustração e pressão",
    items: [
      "Reajo com intensidade desproporcional a situações do dia a dia.",
      "Sinto preocupação constante, mesmo sem um motivo claro.",
      "Perco o interesse ou o prazer em coisas que antes gostava de fazer.",
      "Fico inquieta ou tensa a ponto de ser difícil relaxar.",
      "Sinto-me cansada ou sem energia mesmo depois de descansar.",
      "Sinto culpa ou frustração forte depois de não conseguir fazer algo que eu queria.",
    ]},
  { key: "social", label: "Sensorial/Social", number: "04", title: "Sensorial e Social", subtitle: "Como você processa o ambiente e as interações",
    items: [
      "Sons, luzes ou texturas específicas me incomodam mais do que parecem incomodar outras pessoas.",
      "Prefiro fazer as coisas sempre do mesmo jeito e fico desconfortável com mudanças repentinas.",
      "Tenho dificuldade de perceber o que a outra pessoa está sentindo só olhando pra ela.",
      "Me envolvo tão profundamente em um assunto que perco a noção do que está ao redor.",
      "Sinto que preciso 'estudar' ou decorar como agir em situações sociais.",
      "Reparo em detalhes ou padrões que a maioria das pessoas não percebe.",
    ]},
];

const TOTAL_QUESTIONS = BLOCKS.reduce((s, b) => s + b.items.length, 0);
const MAX_SCORE = TOTAL_QUESTIONS * 4;

const AREA_TEXT = {
  "Trabalho": "no trabalho, isso costuma aparecer como prazos apertados, retrabalho ou a sensação de nunca estar em dia.",
  "Estudos": "nos estudos, isso costuma aparecer como dificuldade de manter uma rotina de leitura ou terminar trabalhos a tempo.",
  "Rotina em casa": "na rotina de casa, isso costuma aparecer como tarefas domésticas acumuladas ou dificuldade de manter organização.",
  "Relacionamentos": "nos relacionamentos, isso costuma aparecer como dificuldade de acompanhar combinados ou reações emocionais que pesam nas relações.",
  "Várias áreas": "isso costuma aparecer espalhado por várias áreas da sua vida ao mesmo tempo, sem um lugar só onde se concentra.",
};

const TIPS = {
  execucao: [
    "Divida a tarefa em uma ação de no máximo 2 minutos. Cérebros que travam na iniciação costumam destravar com o menor passo possível, não com o maior.",
    "Troque 'terminar a tarefa' por 'começar a tarefa' como meta do dia.",
    "Deixe o ambiente pronto na noite anterior — reduzir decisões no momento de começar ajuda.",
  ],
  atencao: [
    "Trabalhe em blocos curtos (15–25 minutos) com pausas programadas, em vez de tentar manter foco longo.",
    "Anote tudo no momento em que pensar — memória de trabalho não é falha de caráter, é limitação real.",
    "Elimine estímulos concorrentes antes de começar, não durante.",
  ],
  emocional: [
    "Nomeie a emoção em voz alta ou por escrito assim que perceber a reação — isso já reduz a intensidade.",
    "Dê a si mesma um intervalo de alguns minutos antes de reagir a uma frustração.",
    "Troque autocrítica por curiosidade: em vez de 'por que fiz isso de novo', pergunte 'o que estava acontecendo antes disso'.",
  ],
  social: [
    "Permita-se tempo sozinha depois de interações sociais, sem culpa — é recarga, não antissocialidade.",
    "Ajuste o ambiente ao seu redor quando possível, em vez de tentar se adaptar a ele.",
    "Prepare roteiros simples para situações sociais previsíveis — isso reduz o custo de 'atuar'.",
  ],
};

function getBand(total) {
  const q1 = Math.round(MAX_SCORE * 0.25);
  const q2 = Math.round(MAX_SCORE * 0.5);
  const q3 = Math.round(MAX_SCORE * 0.75);
  const pct = total / MAX_SCORE;
  if (pct < 0.25) return { label: "Padrão pontual", min: 0, max: q1 };
  if (pct < 0.5) return { label: "Padrão moderado", min: q1, max: q2 };
  if (pct < 0.75) return { label: "Padrão consistente", min: q2, max: q3 };
  return { label: "Padrão muito consistente", min: q3, max: MAX_SCORE };
}

const COMBO_TEXT = {
  "execucao|atencao": "seus sinais mais fortes aparecem juntos em Execução e Atenção — o padrão típico é saber o que fazer, mas perder o fio no meio do caminho, seja por travar antes de começar, seja por se distrair depois.",
  "execucao|emocional": "seus sinais mais fortes aparecem juntos em Execução e Emocional — o padrão típico é travar na tarefa e, na sequência, sentir uma frustração ou culpa desproporcional por não ter conseguido.",
  "execucao|social": "seus sinais mais fortes aparecem juntos em Execução e no bloco Sensorial/Social — o padrão típico é a dificuldade de iniciar tarefas se somar a um ambiente ou rotina que pesa mais do que deveria.",
  "atencao|emocional": "seus sinais mais fortes aparecem juntos em Atenção e Emocional — o padrão típico é a dificuldade de sustentar o foco vir acompanhada de reações emocionais intensas quando algo sai do previsto.",
  "atencao|social": "seus sinais mais fortes aparecem juntos em Atenção e no bloco Sensorial/Social — o padrão típico é a atenção oscilar bastante conforme o ambiente ao redor, sensorial ou social, muda.",
  "emocional|social": "seus sinais mais fortes aparecem juntos em Emocional e no bloco Sensorial/Social — o padrão típico é sentir as coisas com intensidade e, ao mesmo tempo, precisar de mais esforço pra lidar com estímulos e interações.",
};

function comboKey(a, b) {
  return [a, b].sort().join("|");
}

function getInsightText(dominantKey, secondaryKey, band) {
  const combo = COMBO_TEXT[comboKey(dominantKey, secondaryKey)];
  const prefix = {
    "Padrão pontual": "Nada aqui aponta um padrão forte ainda, mas ",
    "Padrão moderado": "Um padrão começa a aparecer: ",
    "Padrão consistente": "Um padrão consistente aparece: ",
    "Padrão muito consistente": "Um padrão forte e recorrente aparece: ",
  }[band.label];
  return prefix + combo;
}

function RadarChart({ data, dominantIndex }) {
  const size = 280;
  const center = size / 2;
  const maxR = size / 2 - 44;
  const n = data.length;
  const angleFor = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  function pointFor(i, fraction) {
    const angle = angleFor(i);
    const r = maxR * fraction;
    return [center + r * Math.cos(angle), center + r * Math.sin(angle)];
  }
  const rings = [0.25, 0.5, 0.75, 1];
  const dataPoints = data.map((d, i) => pointFor(i, d.value / d.fullMark));
  const dataPath = dataPoints.map((p) => p.join(",")).join(" ");
  const [pinX, pinY] = dataPoints[dominantIndex];
  return (
    <svg viewBox={`0 0 ${size} ${size + 18}`} width="100%" height="298">
      {rings.map((f, ri) => {
        const pts = data.map((_, i) => pointFor(i, f).join(",")).join(" ");
        return <polygon key={ri} points={pts} fill="none" stroke={COLORS.grayB} strokeWidth="1" />;
      })}
      {data.map((_, i) => {
        const [x, y] = pointFor(i, 1);
        return <line key={i} x1={center} y1={center} x2={x} y2={y} stroke={COLORS.grayB} strokeWidth="1" />;
      })}
      <polygon points={dataPath} fill={COLORS.tealMid} fillOpacity="0.35" stroke={COLORS.teal} strokeWidth="2" />
      {dataPoints.map((p, i) => (<circle key={i} cx={p[0]} cy={p[1]} r="3.5" fill={COLORS.teal} />))}
      <circle cx={pinX} cy={pinY} r="9" fill="none" stroke={COLORS.amber} strokeWidth="1.5" opacity="0.5" />
      <circle cx={pinX} cy={pinY} r="5.5" fill={COLORS.amber} stroke={COLORS.white} strokeWidth="1.5" />
      {data.map((d, i) => {
        const [x, y] = pointFor(i, 1.28);
        return (
          <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="middle" fontSize="11.5" fontFamily="Jost" fill={i === dominantIndex ? COLORS.amber : COLORS.grayD} fontWeight={i === dominantIndex ? "600" : "400"}>
            {d.subject}
          </text>
        );
      })}
    </svg>
  );
}

function Progress({ pct }) {
  return (
    <div style={{ height: 4, background: COLORS.grayB, borderRadius: 4, marginBottom: 28, overflow: "hidden" }}>
      <div style={{ height: "100%", width: `${pct}%`, background: COLORS.teal, borderRadius: 4, transition: "width 0.3s ease" }} />
    </div>
  );
}

function MapeamentoInicial() {
  const [screen, setScreen] = useState("intro");
  const [blockIndex, setBlockIndex] = useState(0);
  const [answers, setAnswers] = useState({});
  const [nome, setNome] = useState("");
  const [faixa, setFaixa] = useState("");
  const [area, setArea] = useState("");
  const [whatsapp, setWhatsapp] = useState("");
  const [email, setEmail] = useState("");
  const [sending, setSending] = useState(false);

  const currentBlock = BLOCKS[blockIndex];

  function setAnswer(blockKey, i, value) {
    setAnswers((prev) => ({ ...prev, [`${blockKey}-${i}`]: value }));
  }
  function blockAnswered(block) {
    return block.items.every((_, i) => answers[`${block.key}-${i}`] !== undefined);
  }
  function blockScore(block) {
    return block.items.reduce((s, _, i) => s + (answers[`${block.key}-${i}`] ?? 0), 0);
  }

  const total = BLOCKS.reduce((s, b) => s + blockScore(b), 0);
  const band = getBand(total);
  const radarData = BLOCKS.map((b) => ({ subject: b.label, value: blockScore(b), fullMark: b.items.length * 4 }));
  const dominantIndex = BLOCKS.reduce((best, b, i) => (blockScore(b) > blockScore(BLOCKS[best]) ? i : best), 0);
  const dominantBlock = BLOCKS[dominantIndex];
  const secondaryIndex = BLOCKS.reduce((best, b, i) => {
    if (i === dominantIndex) return best;
    if (best === dominantIndex || blockScore(b) > blockScore(BLOCKS[best])) return i;
    return best;
  }, dominantIndex === 0 ? 1 : 0);
  const secondaryBlock = BLOCKS[secondaryIndex];
  const insightText = getInsightText(dominantBlock.key, secondaryBlock.key, band);

  const topItems = BLOCKS.flatMap((b) => b.items.map((text, i) => ({ text, value: answers[`${b.key}-${i}`] ?? 0 })))
    .filter((it) => it.value >= 3)
    .sort((a, c) => c.value - a.value)
    .slice(0, 3);

  const progressPct =
    screen === "personalizacao" ? 5 :
    screen === "instrucoes" ? 8 :
    screen === "questions" ? 10 + Math.round((blockIndex / BLOCKS.length) * 70) :
    screen === "contato" ? 85 :
    screen === "resultado" ? 100 : 0;

  async function submitContact(e) {
    e.preventDefault();
    setSending(true);
    try {
      await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          access_key: WEB3FORMS_KEY,
          subject: "Novo lead — Mapeamento Inicial",
          nome, faixa_etaria: faixa, area, whatsapp, email,
          pontuacao: `${total}/${MAX_SCORE}`,
          faixa_resultado: band.label,
        }),
      });
    } catch (err) {
      // segue mesmo se falhar o envio — não bloqueia a entrega do resultado
    }
    setSending(false);
    setScreen("resultado");
  }

  return (
    <div style={{ minHeight: "100vh", background: COLORS.cream, display: "flex", justifyContent: "center", padding: "0 0 60px" }}>
      <div style={{ width: "100%", maxWidth: 480, padding: "28px 20px" }}>
        {screen !== "intro" && <Progress pct={progressPct} />}

        {screen === "intro" && (
          <div className="fade-in">
            <p style={{ fontSize: 12, letterSpacing: "0.12em", textTransform: "uppercase", color: COLORS.tealMid, fontWeight: 600, marginBottom: 10 }}>
              Mapeamento Inicial
            </p>
            <h1 className="serif" style={{ fontSize: 29, lineHeight: 1.25, color: COLORS.grayD, marginBottom: 16 }}>
              Você sabe exatamente o que precisa fazer.<br />E mesmo assim não consegue.
            </h1>
            <p style={{ fontSize: 15, color: COLORS.grayM, lineHeight: 1.65, marginBottom: 20 }}>
              Talvez esse seja o momento em que você para de se cobrar e começa a se entender.
              Não é só um teste — é um primeiro espelho com direção inicial.
            </p>
            <div style={{ background: COLORS.white, border: `1px solid ${COLORS.grayB}`, borderRadius: 16, padding: "20px 20px", marginBottom: 24 }}>
              {BLOCKS.map((b, i) => (
                <div key={b.key} style={{ display: "flex", alignItems: "center", gap: 12, padding: "8px 0", borderBottom: i < BLOCKS.length - 1 ? `1px solid ${COLORS.grayL}` : "none" }}>
                  <span className="serif" style={{ fontSize: 13, color: COLORS.tealAcc, fontWeight: 600, minWidth: 20 }}>{b.number}</span>
                  <span style={{ fontSize: 14, color: COLORS.grayD }}>{b.title}</span>
                </div>
              ))}
            </div>
            <div style={{ background: COLORS.tealLight, borderRadius: 12, padding: "12px 16px", marginBottom: 24 }}>
              <p style={{ fontSize: 12, color: COLORS.teal, lineHeight: 1.5 }}>
                Instrumentos de referência: ASRS-18 · AQ-10 · PHQ-9 · GAD-7
              </p>
            </div>
            <button className="opt-btn" onClick={() => setScreen("personalizacao")}
              style={{ width: "100%", background: COLORS.teal, color: COLORS.white, borderRadius: 12, padding: "16px 20px", fontSize: 15, fontWeight: 600 }}>
              Começar meu mapeamento
            </button>
            <p style={{ fontSize: 12, color: COLORS.grayM, textAlign: "center", marginTop: 12 }}>
              Leva cerca de 5 minutos · {TOTAL_QUESTIONS} afirmações
            </p>
          </div>
        )}

        {screen === "personalizacao" && (
          <div className="fade-in">
            <p style={{ fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: COLORS.tealMid, fontWeight: 600, marginBottom: 6 }}>
              Antes de começar
            </p>
            <h2 className="serif" style={{ fontSize: 23, color: COLORS.grayD, marginBottom: 20 }}>
              Vamos te conhecer um pouco
            </h2>

            <label style={{ fontSize: 13, fontWeight: 600, color: COLORS.grayD, display: "block", marginBottom: 6 }}>Nome</label>
            <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Seu nome"
              style={{ width: "100%", padding: "12px 14px", borderRadius: 10, border: `1.5px solid ${COLORS.grayB}`, fontSize: 15, marginBottom: 20, background: COLORS.white }} />

            <label style={{ fontSize: 13, fontWeight: 600, color: COLORS.grayD, display: "block", marginBottom: 6 }}>Faixa etária</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20 }}>
              {FAIXAS.map((f) => (
                <button key={f} className="opt-btn" onClick={() => setFaixa(f)}
                  style={{ padding: "9px 14px", borderRadius: 20, border: `1.5px solid ${faixa === f ? COLORS.teal : COLORS.grayB}`,
                    background: faixa === f ? COLORS.teal : COLORS.white, color: faixa === f ? COLORS.white : COLORS.grayD, fontSize: 13.5 }}>
                  {f}
                </button>
              ))}
            </div>

            <label style={{ fontSize: 13, fontWeight: 600, color: COLORS.grayD, display: "block", marginBottom: 6 }}>Em qual área você percebe mais dificuldade?</label>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 28 }}>
              {AREAS.map((a) => (
                <button key={a} className="opt-btn" onClick={() => setArea(a)}
                  style={{ padding: "9px 14px", borderRadius: 20, border: `1.5px solid ${area === a ? COLORS.teal : COLORS.grayB}`,
                    background: area === a ? COLORS.teal : COLORS.white, color: area === a ? COLORS.white : COLORS.grayD, fontSize: 13.5 }}>
                  {a}
                </button>
              ))}
            </div>

            <button disabled={!nome || !faixa || !area} className="opt-btn"
              onClick={() => setScreen("instrucoes")}
              style={{ width: "100%", background: (nome && faixa && area) ? COLORS.teal : COLORS.grayB, color: COLORS.white, borderRadius: 12, padding: "16px 20px", fontSize: 15, fontWeight: 600 }}>
              Continuar
            </button>
          </div>
        )}

        {screen === "instrucoes" && (
          <div className="fade-in">
            <p style={{ fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: COLORS.tealMid, fontWeight: 600, marginBottom: 6 }}>
              Como responder
            </p>
            <h2 className="serif" style={{ fontSize: 23, color: COLORS.grayD, marginBottom: 16 }}>
              Pense em como você tem funcionado nos últimos seis meses
            </h2>
            <p style={{ fontSize: 14, color: COLORS.grayM, marginBottom: 20 }}>
              Escolha a alternativa que melhor representa sua realidade:
            </p>
            <div style={{ background: COLORS.white, border: `1px solid ${COLORS.grayB}`, borderRadius: 14, overflow: "hidden", marginBottom: 28 }}>
              {SCALE.map((s, i) => (
                <div key={s.v} style={{ display: "flex", alignItems: "center", gap: 14, padding: "13px 16px", background: i % 2 ? COLORS.grayL : COLORS.white }}>
                  <span className="serif" style={{ fontWeight: 700, color: COLORS.teal, minWidth: 16 }}>{s.v}</span>
                  <span style={{ fontSize: 14.5, color: COLORS.grayD }}>{s.label}</span>
                </div>
              ))}
            </div>
            <button className="opt-btn" onClick={() => setScreen("questions")}
              style={{ width: "100%", background: COLORS.teal, color: COLORS.white, borderRadius: 12, padding: "16px 20px", fontSize: 15, fontWeight: 600 }}>
              Começar
            </button>
          </div>
        )}

        {screen === "questions" && (
          <div className="fade-in" key={currentBlock.key}>
            <p style={{ fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: COLORS.tealMid, fontWeight: 600, marginBottom: 6 }}>
              Bloco {currentBlock.number} de 0{BLOCKS.length}
            </p>
            <h2 className="serif" style={{ fontSize: 23, color: COLORS.grayD, marginBottom: 4 }}>{currentBlock.title}</h2>
            <p style={{ fontSize: 14, color: COLORS.grayM, marginBottom: 20 }}>{currentBlock.subtitle}</p>

            <div style={{ display: "flex", flexDirection: "column", gap: 16, marginBottom: 26 }}>
              {currentBlock.items.map((text, i) => {
                const key = `${currentBlock.key}-${i}`;
                const val = answers[key];
                return (
                  <div key={key} style={{ background: COLORS.white, border: `1px solid ${COLORS.grayB}`, borderRadius: 14, padding: "16px 16px" }}>
                    <p style={{ fontSize: 14.5, color: COLORS.grayD, lineHeight: 1.5, marginBottom: 12 }}>{text}</p>
                    <div style={{ display: "flex", gap: 6 }}>
                      {SCALE.map((s) => (
                        <button key={s.v} className="opt-btn" onClick={() => setAnswer(currentBlock.key, i, s.v)}
                          title={s.label}
                          style={{ flex: 1, padding: "8px 2px", borderRadius: 8, border: `1.5px solid ${val === s.v ? COLORS.teal : COLORS.grayB}`,
                            background: val === s.v ? COLORS.tealLight : COLORS.white, color: val === s.v ? COLORS.teal : COLORS.grayM,
                            fontWeight: 700, fontSize: 13.5 }}>
                          {s.v}
                        </button>
                      ))}
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                      <span style={{ fontSize: 9.5, color: COLORS.grayM }}>Nunca</span>
                      <span style={{ fontSize: 9.5, color: COLORS.grayM }}>Quase sempre</span>
                    </div>
                  </div>
                );
              })}
            </div>

            <div style={{ display: "flex", gap: 10 }}>
              {blockIndex > 0 && (
                <button onClick={() => setBlockIndex((b) => b - 1)}
                  style={{ flex: "0 0 auto", padding: "14px 18px", borderRadius: 12, border: `1.5px solid ${COLORS.grayB}`, background: COLORS.white, color: COLORS.grayM, fontSize: 14, fontWeight: 600 }}>
                  ← Voltar
                </button>
              )}
              <button disabled={!blockAnswered(currentBlock)}
                onClick={() => { if (blockIndex < BLOCKS.length - 1) setBlockIndex((b) => b + 1); else setScreen("contato"); }}
                style={{ flex: 1, padding: "14px 18px", borderRadius: 12, border: "none", background: blockAnswered(currentBlock) ? COLORS.teal : COLORS.grayB, color: COLORS.white, fontSize: 14, fontWeight: 600 }}>
                {blockIndex < BLOCKS.length - 1 ? "Próximo bloco →" : "Ver meu resultado"}
              </button>
            </div>
          </div>
        )}

        {screen === "contato" && (
          <div className="fade-in">
            <p style={{ fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: COLORS.tealMid, fontWeight: 600, marginBottom: 6 }}>
              Última etapa
            </p>
            <h2 className="serif" style={{ fontSize: 22, color: COLORS.grayD, marginBottom: 20 }}>
              Preencha seus dados para receber seu resultado completo e o e-book
            </h2>
            <form onSubmit={submitContact}>
              <label style={{ fontSize: 13, fontWeight: 600, color: COLORS.grayD, display: "block", marginBottom: 6 }}>Nome</label>
              <input value={nome} onChange={(e) => setNome(e.target.value)} required
                style={{ width: "100%", padding: "12px 14px", borderRadius: 10, border: `1.5px solid ${COLORS.grayB}`, fontSize: 15, marginBottom: 16, background: COLORS.white }} />

              <label style={{ fontSize: 13, fontWeight: 600, color: COLORS.grayD, display: "block", marginBottom: 6 }}>WhatsApp</label>
              <input value={whatsapp} onChange={(e) => setWhatsapp(e.target.value)} required placeholder="(45) 99999-9999"
                style={{ width: "100%", padding: "12px 14px", borderRadius: 10, border: `1.5px solid ${COLORS.grayB}`, fontSize: 15, marginBottom: 16, background: COLORS.white }} />

              <label style={{ fontSize: 13, fontWeight: 600, color: COLORS.grayD, display: "block", marginBottom: 6 }}>E-mail</label>
              <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required placeholder="voce@email.com"
                style={{ width: "100%", padding: "12px 14px", borderRadius: 10, border: `1.5px solid ${COLORS.grayB}`, fontSize: 15, marginBottom: 22, background: COLORS.white }} />

              <p style={{ fontSize: 11.5, color: COLORS.grayM, lineHeight: 1.5, marginBottom: 20 }}>
                Autorizo o envio do meu resultado e de conteúdos relacionados. Meus dados serão tratados com respeito à privacidade.
              </p>

              <button type="submit" disabled={sending} className="opt-btn"
                style={{ width: "100%", background: COLORS.teal, color: COLORS.white, borderRadius: 12, padding: "16px 20px", fontSize: 15, fontWeight: 600, opacity: sending ? 0.7 : 1 }}>
                {sending ? "Enviando..." : "Ver meu resultado e receber o e-book"}
              </button>
            </form>
          </div>
        )}

        {screen === "resultado" && (
          <div className="fade-in">
            <p style={{ fontSize: 11, letterSpacing: "0.14em", textTransform: "uppercase", color: COLORS.tealMid, fontWeight: 600, textAlign: "center", marginBottom: 8 }}>
              Seu resultado
            </p>
            <h2 className="serif" style={{ fontSize: 28, color: COLORS.grayD, textAlign: "center", marginBottom: 28 }}>
              {nome ? `${nome}, aqui está seu Mapa` : "Seu Mapa de Funcionamento"}
            </h2>

            <div style={{ display: "flex", justifyContent: "center", marginBottom: 28 }}>
              <RadarChart data={radarData} dominantIndex={dominantIndex} />
            </div>

            <div style={{ background: COLORS.grayD, color: COLORS.white, borderRadius: 20, padding: "34px 28px", textAlign: "center", marginBottom: 32 }}>
              <p style={{ fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: COLORS.tealAcc, marginBottom: 10 }}>
                Faixa: {band.min} a {band.max} pontos
              </p>
              <p className="serif" style={{ fontSize: 46, marginBottom: 2, lineHeight: 1 }}>
                {total}<span style={{ fontSize: 18, color: COLORS.grayB }}> / {MAX_SCORE}</span>
              </p>
              <p style={{ fontSize: 13.5, letterSpacing: "0.06em", textTransform: "uppercase", color: COLORS.amber, fontWeight: 600, margin: "10px 0 18px" }}>
                {band.label}
              </p>
              <p style={{ fontSize: 14.5, color: COLORS.grayB, lineHeight: 1.7, maxWidth: 380, margin: "0 auto" }}>
                {insightText}
              </p>
              {area && (
                <p style={{ fontSize: 13.5, color: COLORS.tealAcc, lineHeight: 1.7, maxWidth: 380, margin: "18px auto 0", paddingTop: 18, borderTop: `1px solid rgba(255,255,255,0.15)` }}>
                  Em <strong>{area}</strong>, {AREA_TEXT[area]}
                </p>
              )}
            </div>

            {topItems.length > 0 && (
              <div style={{ marginBottom: 32 }}>
                <p className="serif" style={{ fontSize: 16, color: COLORS.grayD, marginBottom: 12 }}>O que mais bateu em você</p>
                {topItems.map((it, i) => (
                  <p key={i} style={{ fontSize: 14, color: COLORS.grayD, lineHeight: 1.6, marginBottom: 10, fontStyle: "italic" }}>
                    "{it.text}"
                  </p>
                ))}
              </div>
            )}

            <p className="serif" style={{ fontSize: 16, color: COLORS.grayD, marginBottom: 14 }}>Por bloco</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 16, marginBottom: 32 }}>
              {BLOCKS.map((b) => {
                const score = blockScore(b);
                const maxB = b.items.length * 4;
                const pct = Math.round((score / maxB) * 100);
                return (
                  <div key={b.key}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 13.5, color: COLORS.grayD }}>{b.title}</span>
                      <span style={{ fontSize: 13, color: COLORS.grayM }}>{score}/{maxB}</span>
                    </div>
                    <div style={{ height: 4, background: COLORS.grayL, borderRadius: 4, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${pct}%`, background: b.key === dominantBlock.key ? COLORS.teal : COLORS.grayB, borderRadius: 4 }} />
                    </div>
                  </div>
                );
              })}
            </div>

            <p className="serif" style={{ fontSize: 16, color: COLORS.grayD, marginBottom: 12 }}>O que fazer agora</p>
            <div style={{ marginBottom: 28 }}>
              {TIPS[dominantBlock.key].map((t, i) => (
                <p key={i} style={{ fontSize: 14, color: COLORS.grayD, lineHeight: 1.7, marginBottom: 10, paddingLeft: 16, borderLeft: `2px solid ${COLORS.tealAcc}` }}>{t}</p>
              ))}
            </div>

            <p style={{ fontSize: 12.5, color: COLORS.grayM, lineHeight: 1.6, fontStyle: "italic", marginBottom: 32 }}>
              Isso é um retrato preliminar, não um diagnóstico. Ele te ajuda a nomear o que você sente —
              a leitura completa, com testes validados e acompanhamento profissional, acontece na
              Avaliação Interdisciplinar.
            </p>

            <div style={{ borderLeft: `3px solid ${COLORS.amber}`, paddingLeft: 18, marginBottom: 28 }}>
              <p style={{ fontSize: 12.5, letterSpacing: "0.06em", textTransform: "uppercase", color: COLORS.grayD, fontWeight: 700, marginBottom: 8 }}>
                Próximo passo
              </p>
              <p style={{ fontSize: 14, color: COLORS.grayD, lineHeight: 1.65 }}>
                Você já pode baixar seu e-book abaixo. Se esse padrão faz sentido pra você e quiser
                aprofundar com calma, dá pra agendar uma Consulta Inicial — uma conversa só sua e
                minha, onde eu te escuto e monto um plano personalizado a partir daqui.
              </p>
            </div>

            <a href={`https://wa.me/5545991578060?text=${encodeURIComponent(`Olá! Fiz o Mapeamento Inicial e gostaria de agendar uma Consulta Inicial. Meu nome é ${nome}.`)}`}
              target="_blank" rel="noopener noreferrer" style={{ display: "block", marginBottom: 12 }}>
              <button className="opt-btn" style={{ width: "100%", background: COLORS.amber, color: COLORS.white, borderRadius: 12, padding: "16px 20px", fontSize: 15, fontWeight: 600 }}>
                Agendar minha Consulta Inicial
              </button>
            </a>

            <a href={`https://wa.me/5545991578060?text=${encodeURIComponent(`Olá! Fiz o Mapeamento Inicial. Meu resultado foi ${total}/${MAX_SCORE} (${band.label}) e minha maior dificuldade é em ${area || "não informado"}. Meu nome é ${nome}.`)}`}
              target="_blank" rel="noopener noreferrer" style={{ display: "block", marginBottom: 16 }}>
              <button className="opt-btn" style={{ width: "100%", background: COLORS.white, color: COLORS.teal, border: `1.5px solid ${COLORS.teal}`, borderRadius: 12, padding: "15px 20px", fontSize: 14.5, fontWeight: 600 }}>
                Falar sobre o meu resultado no WhatsApp
              </button>
            </a>

            <a href="./ebook-mapeamento-inicial.pdf" download style={{ display: "block", textAlign: "center" }}>
              <span style={{ fontSize: 13.5, color: COLORS.grayM, textDecoration: "underline" }}>Baixar meu e-book</span>
            </a>
        
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MapeamentoInicial />);
</script>
</body>
</html>
